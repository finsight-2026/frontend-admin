name: 백오피스 CI

on:
  pull_request:
    branches: [feat/finsight-admin, develop, main]
  push:
    branches: [feat/finsight-admin, develop, main]

permissions:
  contents: read

jobs:
  verify:
    name: 빌드 및 브라우저 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: bash -n deploy/publish.sh
      - run: bash -n deploy/configure-backend.sh
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: 배포 아카이브와 체크섬 생성
        run: |
          mkdir -p release
          tar -C dist -czf release/dist.tar.gz .
          cd release
          sha256sum dist.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: finsight-admin-${{ github.sha }}
          path: release/
          if-no-files-found: error
          compression-level: 0
